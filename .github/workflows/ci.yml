name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: growth_os
          POSTGRES_PASSWORD: growth_os
          POSTGRES_USER: growth_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growth_os -d growth_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GROWTH_OS_DATABASE_URL: postgresql+asyncpg://growth_os:growth_os@localhost:5432/growth_os
      GROWTH_OS_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.1.2'
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Apply migrations
        run: alembic upgrade head
      - name: Test
        run: pytest
      - name: Audit dependencies
        run: pip-audit
