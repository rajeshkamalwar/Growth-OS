services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: growth_os
      POSTGRES_PASSWORD: growth_os
      POSTGRES_USER: growth_os
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth_os -d growth_os"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - growth_os_postgres:/var/lib/postgresql/data

volumes:
  growth_os_postgres:


